<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="Tanmay Mandal, Business Analyst: operations, ERP and manufacturing data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6F7F9"/>
      <stop offset="1" stop-color="#E4E9F0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#C9D2DE"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="1278" height="298" rx="18"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1278" height="298" rx="18" fill="url(#bg)" stroke="#D3DAE4" stroke-width="2"/>
  <g clip-path="url(#card)">
    <rect x="860" y="0" width="420" height="300" fill="url(#grid)" opacity="0.7"/>
    <rect x="0" y="0" width="10" height="300" fill="#17283B"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="92" fill="#17283B" font-size="46" font-weight="700">Tanmay Mandal</text>
    <text x="60" y="134" fill="#3B5573" font-size="22" font-weight="600">Business Analyst · Operations, ERP &amp; Manufacturing Data</text>
    <text x="60" y="174" fill="#4A5B6E" font-size="17">Messy operational data → reconciled, audit-ready datasets and dashboards</text>
    <text x="60" y="200" fill="#4A5B6E" font-size="17">SQL · Excel 365 · Power Query · Power BI · Prime ERP</text>

    <g font-size="15" fill="#17283B">
      <rect x="60" y="226" width="176" height="40" rx="8" fill="#FFFFFF" stroke="#C9D2DE"/>
      <text x="148" y="251" text-anchor="middle"><tspan font-weight="700">63k</tspan> challan lines</text>
      <rect x="248" y="226" width="196" height="40" rx="8" fill="#FFFFFF" stroke="#C9D2DE"/>
      <text x="346" y="251" text-anchor="middle"><tspan font-weight="700">Δ 0</tspan> tie-out, 11 years</text>
      <rect x="456" y="226" width="186" height="40" rx="8" fill="#FFFFFF" stroke="#C9D2DE"/>
      <text x="549" y="251" text-anchor="middle"><tspan font-weight="700">920</tspan> machines planned</text>
      <rect x="654" y="226" width="186" height="40" rx="8" fill="#FFFFFF" stroke="#C9D2DE"/>
      <text x="747" y="251" text-anchor="middle"><tspan font-weight="700">1,285</tspan> loads tied out</text>
    </g>
  </g>

  <!-- reconciliation motif: two ledgers meeting at a check -->
  <g transform="translate(930,60)">
    <rect x="0" y="0" width="120" height="150" rx="10" fill="#FFFFFF" stroke="#9FB0C4" stroke-width="2"/>
    <rect x="16" y="22" width="88" height="8" rx="3" fill="#C9D2DE"/>
    <rect x="16" y="44" width="70" height="8" rx="3" fill="#C9D2DE"/>
    <rect x="16" y="66" width="80" height="8" rx="3" fill="#C9D2DE"/>
    <rect x="16" y="88" width="60" height="8" rx="3" fill="#C9D2DE"/>
    <rect x="16" y="118" width="88" height="10" rx="3" fill="#3B5573"/>
    <rect x="170" y="0" width="120" height="150" rx="10" fill="#FFFFFF" stroke="#9FB0C4" stroke-width="2"/>
    <rect x="186" y="22" width="88" height="8" rx="3" fill="#C9D2DE"/>
    <rect x="186" y="44" width="76" height="8" rx="3" fill="#C9D2DE"/>
    <rect x="186" y="66" width="64" height="8" rx="3" fill="#C9D2DE"/>
    <rect x="186" y="88" width="82" height="8" rx="3" fill="#C9D2DE"/>
    <rect x="186" y="118" width="88" height="10" rx="3" fill="#3B5573"/>
    <circle cx="145" cy="190" r="26" fill="#2E8B57"/>
    <path d="M133 190 l8 9 l16 -18" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M104 123 Q145 150 145 164 M186 123 Q145 150 145 164" fill="none" stroke="#9FB0C4" stroke-width="2" stroke-dasharray="5 4"/>
  </g>
</svg>
